; FlowForge PHP configuration

[PHP]
; Error handling — show nothing to clients, log everything
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Limits
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 50M
upload_max_filesize = 50M

; Timezone
date.timezone = UTC

; Session
session.gc_maxlifetime = 7200
