openapi: 3.0.3
info:
  title: FlowForge API
  description: |
    AI Workflow Automation Platform for SMEs.
    Build, run, and monitor automated workflows connecting your apps, APIs, and AI models.
  version: 1.0.0
  contact:
    name: FlowForge
    url: https://github.com/ralph-sison/laravel-ai-workflow-engine

servers:
  - url: /api/v1
    description: Current API version

security:
  - sanctumToken: []

components:
  securitySchemes:
    sanctumToken:
      type: http
      scheme: bearer
      description: Laravel Sanctum API token. Obtain via POST /auth/login.

  schemas:
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        plan: { type: string, enum: [free, pro, enterprise] }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        tenant_id: { type: string, format: uuid }
        roles: { type: array, items: { type: string } }

    Workflow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [draft, active, paused, archived] }
        trigger_type: { type: string, enum: [manual, webhook, schedule] }
        version: { type: integer }
        last_run_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    WorkflowStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [ai, http, transform, notification, condition, delay] }
        order: { type: integer }
        on_error: { type: string, enum: [stop, continue] }
        config: { type: object }

    Execution:
      type: object
      properties:
        id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        status: { type: string, enum: [running, success, failed, cancelled] }
        trigger_type: { type: string, enum: [manual, webhook, schedule] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    Connector:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [openai, claude, ollama, slack, webhook] }
        meta: { type: object, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    Error:
      type: object
      properties:
        message: { type: string }

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new tenant and owner account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization, name, email, password, password_confirmation]
              properties:
                organization: { type: string, example: Acme Corp }
                name: { type: string, example: Ralph Sison }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '201':
          description: Tenant and user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
                      tenant: { $ref: '#/components/schemas/Tenant' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current API token
      responses:
        '204': { description: Logged out }

  /me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }

  /workflows:
    get:
      tags: [Workflows]
      summary: List all workflows for the tenant
      responses:
        '200':
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
    post:
      tags: [Workflows]
      summary: Create a new workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                trigger_type: { type: string, enum: [manual, webhook, schedule], default: manual }
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Workflow' }

  /workflows/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Workflows]
      summary: Get a workflow
      responses:
        '200':
          description: Workflow detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Workflow' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Workflows]
      summary: Update a workflow
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Workflow' }
    delete:
      tags: [Workflows]
      summary: Soft delete a workflow
      responses:
        '204': { description: Deleted }

  /workflows/{id}/activate:
    post:
      tags: [Workflows]
      summary: Activate a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Activated }

  /workflows/{id}/pause:
    post:
      tags: [Workflows]
      summary: Pause a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Paused }

  /workflows/{id}/execute:
    post:
      tags: [Workflows]
      summary: Manually trigger a workflow execution
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Execution started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Execution' }
        '402':
          description: Monthly execution limit reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workflows/{workflowId}/executions:
    get:
      tags: [Executions]
      summary: List executions for a workflow
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Execution list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Execution' }

  /workflows/{workflowId}/executions/{executionId}:
    get:
      tags: [Executions]
      summary: Get execution detail including step logs
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: executionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Execution detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Execution' }

  /workflows/{workflowId}/executions/{executionId}/retry:
    post:
      tags: [Executions]
      summary: Retry a failed execution
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: executionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: New execution started }

  /connectors:
    get:
      tags: [Connectors]
      summary: List all active connectors
      responses:
        '200':
          description: Connector list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Connector' }
    post:
      tags: [Connectors]
      summary: Create a connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, credentials]
              properties:
                name: { type: string }
                type: { type: string, enum: [openai, claude, ollama, slack, webhook] }
                credentials: { type: object, description: Encrypted at rest — never returned in responses }
                meta: { type: object }
      responses:
        '201':
          description: Connector created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Connector' }

  /connectors/{id}/test:
    post:
      tags: [Connectors]
      summary: Test connector credentials with a live API call
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Credentials valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  provider: { type: string }
                  model: { type: string }
        '422':
          description: Credentials invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  error: { type: string }

  /billing:
    get:
      tags: [Billing]
      summary: Current plan, subscription status, and usage
      responses:
        '200':
          description: Billing summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      plan: { type: string, enum: [free, pro, enterprise] }
                      usage:
                        type: object
                        properties:
                          workflows:
                            type: object
                            properties:
                              used: { type: integer }
                              limit: { oneOf: [{ type: integer }, { type: string }] }
                          executions_per_month:
                            type: object
                            properties:
                              used: { type: integer }
                              limit: { oneOf: [{ type: integer }, { type: string }] }

  /webhooks/{slug}:
    post:
      tags: [Webhooks]
      summary: Inbound webhook receiver (public — no auth required)
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: X-FlowForge-Signature
          in: header
          required: true
          schema: { type: string, example: 'sha256=abc123...' }
          description: HMAC-SHA256 signature of the raw request body using the endpoint secret
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: Workflow triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  execution_id: { type: string, format: uuid }
        '401':
          description: Invalid or missing signature
        '422':
          description: Inactive endpoint or non-active workflow
